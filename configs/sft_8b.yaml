# Qwen3-8B world models: same recipe on 4 GPUs with DeepSpeed ZeRO-3. Effective batch 32 = 4 per device x 2 accumulation x 4 GPUs; lr 1e-5.
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: full
deepspeed: configs/ds_z3.json
dataset: dip7p_20k
dataset_dir: data/processed/diplomacy/sft
eval_dataset: dip7p_20k_val
template: qwen3
enable_thinking: false
cutoff_len: 4096
packing: false
overwrite_cache: true
preprocessing_num_workers: 32
output_dir: out/sft/qwen3-8b-dip20k
logging_steps: 20
save_steps: 500
save_total_limit: 1
plot_loss: true
overwrite_output_dir: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: auto
report_to: none
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 500
