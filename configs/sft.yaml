# Full fine-tuning recipe of the world models (LLaMA-Factory). Effective batch 32 = 4 per device x 4 accumulation x 2 GPUs.
# Defaults train Qwen3-1.7B on the Diplomacy 20k set; run/train.sh overrides model, dataset, output_dir (and a few fields) on the command line.
model_name_or_path: Qwen/Qwen3-1.7B
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: full
dataset: dip7p_20k
dataset_dir: data/processed/diplomacy/sft
eval_dataset: dip7p_20k_val
template: qwen3
enable_thinking: false  # the empty <think></think> block is in the prompt (no loss), matching vLLM's enable_thinking=False rendering
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
output_dir: out/sft/qwen3-1.7b-dip20k-v4
logging_steps: 20
save_steps: 500
save_total_limit: 1
plot_loss: true
overwrite_output_dir: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: auto
report_to: none
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 500
