# Behavior-cloned Diplomacy policies (Section 6.4): one GPU, effective batch 32 = 4 per device x 8 accumulation.
# run/q4_agent.sh overrides dataset (agent_<arm>), output_dir and, for world-model initialization, model_name_or_path.
model_name_or_path: Qwen/Qwen3-1.7B
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: full
dataset: agent_real1k
dataset_dir: data/processed/diplomacy/sft_agent
template: qwen3
enable_thinking: false
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
output_dir: out/sft/qwen3-1.7b-agent-real1k
logging_steps: 20
save_strategy: "no"
plot_loss: true
overwrite_output_dir: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
flash_attn: auto
report_to: none
